<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chris Page</title>
    <link rel="stylesheet" href="./style.css" ></link>
</head>
<body>

<!-- Account Form Card -->
 
 <div class="form-card">
<h2>Create an account with us!</h2>

<div class="field">
<label for="username">Username</label>
 <input type="text" id="username" placeholder="e.g. cooluser67" />
 </div>

<div class="field">
<label for="email">e-mail address</label>
<input type="email" id="email" placeholder="e.g. you@email.com" />
</div>

<div class="field">
<label for="password">Password (must be at least 4 characters)</label>
<input type="password" id="password" placeholder="At least 4 characters" />
</div>

 <div class="field">
 <label for="confirm-password">Confirm password</label>
<input type="password" id="confirm-password" placeholder="Re-enter your password" />
    </div>

    <button id="submit-btn">Create account</button>
  </div>

    


<script src="script3.js"></script>
</body>
</html>
