<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandwich Builder</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="form-card">
    <h2>Build your sandwich</h2>

    <div class="field">
      <label><input type="checkbox" id="wheat-bread" /> Wheat bread</label>
      <label><input type="checkbox" id="lettuce" /> Lettuce</label>
      <label><input type="checkbox" id="tomato" /> Tomato</label>
      <label><input type="checkbox" id="peppers" /> Peppers</label>
      <label><input type="checkbox" id="turkey" /> Turkey</label>
      <label><input type="checkbox" id="swiss-cheese" /> Swiss cheese</label>
      <label><input type="checkbox" id="mustard" /> Mustard</label>
    </div>

    <button id="submit-btn">Build my sandwich</button>
  </div>

  <script src="script2.js"></script>
</body>
</html>
