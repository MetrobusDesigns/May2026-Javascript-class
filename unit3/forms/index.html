    <h1>Pizza Delivery Form</h1>
    <form id="pizza-form">
      <div>
        <label>Enter your name for delivery: </label>
        <input id="delivery-name" placeholder="Your Name" />
      </div>

      <div id="toppings">
        <h2>Toppings</h2>
        <div>
          <label>Pepperoni: </label>
          <input id="pepperoni" type="checkbox" />
        </div>

        <div>
          <label>Pineapple: </label>
          <input id="pineapple" type="checkbox" />
        </div>

        <div>
          <label>Anchovies: </label>
          <input id="anchovies" type="checkbox" />
        </div>
      </div>

      <div>
        <h2>Crust</h2>

        <div>
            <label>Regular: </label>
            <input id="regular" type="radio" name="crust" checked>
        </div>

        <div>
            <label>Thin: </label>
            <input id="thin" type="radio" name="crust"> 
        </div>

        <div>
            <label>Cheesy: </label>
            <input id="cheesy" type="radio" name="crust">
        </div>

      </div>

      <button>Submit</button>
    </form>

<!-- Account Form Card -->
 
  <div class="form-card">
    <h2>Create an account</h2>

    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="e.g. cooluser99" />
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="e.g. you@email.com" />
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 4 characters" />
    </div>

    <div class="field">
      <label for="confirm-password">Confirm password</label>
      <input type="password" id="confirm-password" placeholder="Re-enter your password" />
    </div>

    <button id="submit-btn">Create account</button>
  </div>

    
    <script src="main.js"></script>
  </body>
</html>
